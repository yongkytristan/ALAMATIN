# ALAMATIN dependency lock
#
# Exact, hash-verified runtime dependencies. The deploy activation script
# installs this file with `pip install --require-hashes`, so every requirement
# must be pinned to an exact version and carry its hashes. A requirement
# without hashes fails the deploy rather than installing something unverified.
#
# Scope: the runtime stack only. The address pipeline itself
# (src/alamatin/api.py and everything it imports) uses only the Python standard
# library; the entries below exist so the ASGI application can be served.
#
# Service entrypoint: uvicorn alamatin.api:app
#
# Both the wheel and the source-distribution hash are listed for each package,
# so the lock stays valid if pip ever prefers the sdist.
#
# Regenerate with:
#   pip install --dry-run --report r.json --only-binary :all: \
#     --python-version 3.11 --implementation cp --abi cp311 \
#     --platform manylinux2014_x86_64 --target /tmp/x uvicorn
# then read each resolved version's hashes from
# https://pypi.org/pypi/<name>/<version>/json

# ASGI server. Required by DEC-005; see docs/decision-log.md.
uvicorn==0.52.4 \
    --hash=sha256:f86e41a149d7d05a9969337e3946a9c171c06a5d42680896daaba624aeac8da1 \
    --hash=sha256:73acfee47a0b133c5de13d219492d62d8a31e935f4fe6e41a232451a15379f86

