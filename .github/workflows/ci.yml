name: Repository checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  repository-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate tracked files and repository policy
        run: python scripts/check_repository.py
      - name: Run test suite
        run: python -m unittest discover -s tests -v

      # ALM-032: a secret or a raw phone number reaching a tracked file must
      # fail the build, not wait for someone to remember to look.
      - name: Scan for secrets and raw PII
        run: python scripts/qa_privacy_scan.py

      # Records critical-path coverage and every skipped test with its reason,
      # and fails on any failure, error, or privacy finding.
      - name: QA report
        run: python scripts/qa_report.py

      # ALM-034: a frozen component changed without re-freezing must fail.
      - name: Verify the release candidate has not drifted
        run: python scripts/build_release_manifest.py --verify

      # ALM-038: a number quoted in a document that its artifact does not hold
      # must fail here rather than reach a reader.
      - name: Verify the evidence index
        run: python scripts/build_evidence_index.py
