name: Repository checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  repository-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate tracked files and repository policy
        run: python scripts/check_repository.py
      - name: Run placeholder test suite
        run: python -m unittest discover -s tests -v
